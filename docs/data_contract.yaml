dataset_name: customers
version: "1.0"
owner: "unknown - requires source owner confirmation"
source_type: file
source_format: csv
acquisition_method: "Downloaded into data/raw/ directory"
expected_update_pattern: batch
primary_key: customer_id
schema:
  - name: customer_id
    type: integer
    nullable: false
    description: "Unique identifier for each customer"
  - name: full_name
    type: string
    nullable: false
    description: "Full name of the customer"
  - name: email
    type: string
    nullable: true
    description: "Email address of the customer"
  - name: city
    type: string
    nullable: true
    description: "City of residence"
  - name: signup_date
    type: date
    nullable: true
    description: "Date the customer registered"
quality_rules:
  - "customer_id must not be null"
  - "customer_id must be unique"
  - "customer_id must be greater than 0"
  - "email must contain valid @ domain format if present"
freshness_expectation: "unknown - requires source owner confirmation"
duplicate_policy: reject
schema_evolution_policy: "Fail pipeline if required columns are missing or types change"
consumer: "Data Analysts and Reporting Dashboards"
notes: "Suitable for a basic contract because customer_id is a reliable, non-null key and the schema is cleanly structured based on profiling in Task 2.2. Owner and update frequency were not confirmed during this lab and should not be assumed."